<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-label="AquaWatch: a block of aquaculture ponds, one detected">
  <!-- An overhead block of bunded ponds, which is literally what the SAR detector
       reads. Row heights are uneven because real pond blocks are; a uniform grid
       reads as a generic app icon. The cyan cell is a detection. Two tones are
       kept far apart so the structure still resolves at 16px. -->
  <rect width="32" height="32" rx="7" fill="#0b1418"/>
  <g>
    <rect x="3"  y="3"  width="11" height="8" rx="1.5" fill="#3a84a0"/>
    <rect x="3"  y="13" width="11" height="7" rx="1.5" fill="#1f4a5d"/>
    <rect x="3"  y="22" width="11" height="7" rx="1.5" fill="#3a84a0"/>
    <rect x="16" y="13" width="13" height="7" rx="1.5" fill="#3a84a0"/>
    <rect x="16" y="22" width="13" height="7" rx="1.5" fill="#1f4a5d"/>
    <rect x="16" y="3"  width="13" height="8" rx="1.5" fill="#7fe4ff"/>
  </g>
</svg>
